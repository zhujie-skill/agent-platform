[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-platform-sdk"
version = "0.1.0"
description = "Typed Python client for Agent Tool Platform API v1"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
